name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build application
        # Automatically sets the base-href to the repository name for correct relative paths
        # If using a custom domain on GitHub pages, change this to: run: npm run build
        run: npm run build -- --base-href /${{ github.event.repository.name }}/

      - name: Fix index.html for CSR
        # When building with Angular SSR enabled, it may generate an index.html that expects a server.
        # We make a copy of index.csr.html (if present) to index.html for GitHub Pages to serve as a CSR fallback,
        # otherwise we just copy `index.html` to `404.html` so client-side routing works.
        run: |
          cp dist/app/browser/index.html dist/app/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/app/browser"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
